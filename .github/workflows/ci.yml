# Everything checkable without a board.
#
# The stages call scripts/check.sh rather than repeating its commands, so a
# green run here means the same thing as a green run on a developer's machine.
# They are separate jobs because the C suites finish in seconds and the ESP-IDF
# toolchain download does not — a broken firmware invariant should be visible
# long before the build job has finished fetching a compiler.

name: CI

on:
  push:
  pull_request:

jobs:
  sim:
    name: Host suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check.sh sim

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # The TypeScript here is type-stripped, not transpiled, so the Node
          # version is load-bearing rather than a preference.
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      - run: ./scripts/check.sh app

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ~/.platformio holds the toolchain and the ESP-IDF checkout. Without
      # this the job spends most of its time downloading a compiler it already
      # downloaded last run.
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install --upgrade platformio
      - run: ./scripts/check.sh firmware

  # Reproducibility is the property that rots silently: a dependency bump
  # reintroduces a build timestamp and nothing complains until someone tries to
  # verify a release months later. Whoever solders and flashes a board is its
  # owner's trust anchor, and the only way out of that is a binary anyone can
  # rebuild - so this is checked on every push, not at release time when it is
  # too late to be a surprise.
  #
  # Its own job, not a stage of check.sh: it builds the firmware twice, and
  # check.sh needs to stay something a developer runs before committing.
  repro:
    name: Reproducible build (firmware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # repro-check.sh clones the repo and checks out a commit, so the
          # default shallow single-commit checkout is enough - but tags matter:
          # PROJECT_VER comes from `git describe`, and a checkout that lost the
          # tags stamps a different version than a full clone would. Fetching
          # everything keeps the hash CI computes equal to the hash a person
          # computes.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install --upgrade platformio
      - run: ./scripts/repro-verify.sh firmware

  # The same argument, applied to the half of a release that most users will
  # actually download. The companion is planned as a GitHub release for three
  # desktop platforms with a firmware flasher inside it (T65) - a program that
  # writes to the device the wallet exists to protect. A checksum next to that
  # download proves the download; only a reproducible build says which source
  # produced it.
  #
  # Split from the firmware job because it needs an entirely different
  # toolchain, and because two red X's that name the half that broke are worth
  # more than one that does not.
  repro-app:
    name: Reproducible build (companion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Tauri's Linux dependencies. The build links against WebKitGTK
      # directly (see src-tauri/Cargo.toml, the linux target section), so a
      # bare runner cannot compile this crate at all.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      # The registry cache only; target/ is deliberately NOT cached. A cached
      # target directory would make the second pass incremental, and an
      # incremental build that matches proves nothing.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: ./scripts/repro-verify.sh companion
