; ============================================================================
; LeekWallet - ESP32-S3 Mini + SSD1306 OLED + 4 Buttons
; ============================================================================
; Hardware:
;   - ESP32-S3 Mini (no PSRAM, 4MB flash)
;   - SSD1306 OLED 128x64 I2C (0x3C)
;   - 4 buttons (K1-K4) active-low with internal pull-ups
; ============================================================================

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; ----------------------------------------------------------------------------
; Flash configuration - CRITICAL for stability
; The attached board reports 16MB (verified from the boot log). A smaller
; value here silently caps usable flash.
; ----------------------------------------------------------------------------
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; ----------------------------------------------------------------------------
; Upload configuration for ESP32-S3 native USB
; Some ESP32-S3 boards need special handling for USB reset
; ----------------------------------------------------------------------------
upload_speed = 921600
upload_port = /dev/ttyACM*
upload_protocol = esptool

; ESP32-S3 USB-Serial-JTAG supports automatic boot mode entry
upload_flags =
    --before=default_reset
    --after=hard_reset

; ----------------------------------------------------------------------------
; Console configuration
; Use UART for stability (USB-CDC can cause boot issues on some boards)
; ----------------------------------------------------------------------------
monitor_speed = 115200
monitor_port = /dev/ttyACM*
monitor_filters = esp32_exception_decoder

; ----------------------------------------------------------------------------
; Custom partition table for NVS storage (wallet data)
; ----------------------------------------------------------------------------
board_build.partitions = partitions.csv

; ----------------------------------------------------------------------------
; Build flags for trezor-crypto
; ----------------------------------------------------------------------------
build_flags =
    -DUSE_ETHEREUM=1
    -DUSE_KECCAK=1
    -DUSE_BIP32_CACHE=0
    -DUSE_BIP39_CACHE=0

; ----------------------------------------------------------------------------
; ESP-IDF Kconfig overrides for BLE
; ----------------------------------------------------------------------------
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

; ----------------------------------------------------------------------------
; Force sdkconfig defaults to be applied
; ----------------------------------------------------------------------------
board_build.sdkconfig_defaults = sdkconfig.defaults

; ============================================================================
; Secure target - QEMU only
;
; Identical firmware with flash encryption and secure boot v2 enabled. Kept as
; a separate environment because these settings burn eFuses on first boot and
; eFuses do not come back. `pio run -e esp32s3` stays safe for an attached
; board; this one is developed against QEMU's emulated fuses until the scheme
; is proven.
;
;   ./scripts/qemu-secure.sh
; ============================================================================
[env:esp32s3-secure]
extends = env:esp32s3
; One complete defaults file, not a list. PlatformIO silently dropped the
; overrides when this was `sdkconfig.defaults;sdkconfig.secure` under `extends`,
; producing a build that looked configured and was not.
board_build.sdkconfig_defaults = sdkconfig.secure
; The base environment pins the defaults file through cmake_extra_args, which
; extends inherits and which wins over sdkconfig_defaults. Overriding one
; without the other produced a build that reported success and had none of the
; security options set.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.secure
board_build.partitions = partitions-secure.csv

; Deliberately no upload_port: flashing this to real hardware should be a
; considered act, not a tab-completion away.
upload_protocol = custom
