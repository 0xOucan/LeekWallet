[package]
name = "leekwallet-companion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "LeekWallet companion app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The RPC proxy's HTTP client. On by default: without it the app cannot reach a
# user-added custom chain at all, since a URL typed at runtime can never be in a
# build-time CSP allowlist (docs/RPC-ACCESS.md).
#
# It was briefly off because `cargo check --target aarch64-linux-android` failed
# to build reqwest's TLS. That was not an Android limitation: cc-rs looks for
# `aarch64-linux-android-clang` and the NDK ships the name with the API level in
# it, so CC_/AR_ have to point at the real files. The android scripts in
# package.json set them; with that done the target builds.
default = ["rpc-proxy"]
rpc-proxy = ["dep:reqwest", "dep:rustls", "dep:webpki-roots"]

# The USB firmware flasher (T65). Behind a feature because espflash pulls in a
# sizeable dependency tree for something most builds do not need, and because a
# build that CANNOT flash is a meaningful thing to ship: until secure boot is
# burned, a flasher is a one-click way to install firmware that reads the PIN.
flasher = ["dep:espflash", "dep:serialport"]

[dependencies]
tauri = { version = "2", features = [] }
# The one plugin the WEBVIEW may call, and the reason it exists: a webview
# request for a new window is dropped by both the desktop and the Android
# runtime, so an explorer link rendered as an anchor is a link that does
# nothing. This opens it in the system browser instead. Its surface in
# `capabilities/default.json` is one command, scoped to https.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# URL parsing for the RPC proxy's policy, which is compiled unconditionally.
# Already in the tree via tauri; named here because src/rpc.rs uses it
# directly and a dependency you rely on should be one you declared.
url = "2"

# The image digest shown before flashing and re-checked before writing
# (src/flash.rs).
#
# Unconditional rather than behind the `flasher` feature, because the *checking*
# is not the part that needs a serial port: a build with no flasher can still
# tell a user what they have downloaded, and the refusal logic is the part worth
# having tests for on every platform.
#
# Both are already in the tree via other dependencies; named here because
# src/flash.rs calls them directly and a dependency you rely on should be one
# you declared.
sha2 = "0.10"
hex = "0.4"

# The proxy's HTTP client. Default features are off to keep http2 (and its own
# C-ish dependency tail) out of a client that only ever makes one POST at a
# time.
#
# This comment used to claim that picking `rustls` over native-tls kept the
# wallet clear of "whatever a phone's certificate store has had added to it".
# That was not true: reqwest's `rustls` feature verifies through
# `rustls-platform-verifier`, which IS the OS store. The intent was right and
# the mechanism was absent; the entry below is what actually delivers it.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset"], optional = true }

# TLS trust anchors, bundled rather than taken from the OS.
#
# reqwest's `rustls` feature always routes verification through
# `rustls-platform-verifier`, which on Android PANICS ("Expect
# rustls-platform-verifier to be initialized") unless it is handed a JNI
# context at startup. Inside a Tauri command that panic aborts the task
# without sending a reply, so `invoke` never settles: every RPC on Android hung
# with no error to show. Proven with a standalone binary on the device.
#
# Rather than wire up JNI to reach a trust store we did not want anyway, the
# root store is built here from webpki-roots and handed to reqwest via
# `use_preconfigured_tls`, so the platform verifier is never constructed on any
# platform. This is also what the comment above always claimed: a wallet is not
# at the mercy of whatever CA a phone has had added to it.
#
# The cost is real and worth stating: revocations and new roots arrive only
# when this dependency is bumped and a release is cut.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

# `#[tokio::test]` for the policy tests. Not a runtime dependency: the command
# itself runs on the async runtime Tauri already provides.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Desktop speaks both USB CDC and BLE; the device serves one at a time
# (PROTOCOL.md 3b), so which one is live is a runtime question, not a build-time
# one.
#
# Since T59 that is true of the phone too. The serial crate has two backends
# behind one API — the `serialport` crate on desktop, the Android USB Host API
# on a phone — so the platform difference is a feature flag here rather than a
# transport that is simply missing there.
[target.'cfg(not(target_os = "android"))'.dependencies]
# espflash as a library, not the CLI: `default-features = false` drops clap,
# indicatif and the rest of the terminal front end, leaving the esptool
# protocol. Desktop only for now -- Android needs the USB Host API and the
# second serial backend transport-serial already models.
espflash = { version = "4.5", default-features = false, features = ["serialport"], optional = true }
serialport = { version = "4", optional = true }
leek-transport-serial = { path = "../transport-serial" }
leek-transport-ble = { path = "../transport-ble" }
tokio = { version = "1", features = ["sync", "rt"] }

# The Linux webview, reached directly to turn the camera on.
#
# WebKitGTK ships with `enable-media-stream` OFF and denies every permission
# request it is not explicitly told to grant, so `getUserMedia` fails with
# NotAllowedError and QR scanning is dead on Linux desktop. Neither is
# reachable through Tauri's own API, so this drops to the underlying webview.
# Version tracks the one Tauri already resolves (see Cargo.lock); a second,
# different webkit2gtk in the tree would be two bindings to one library.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Android gets the same BLE transport crate with its other backend selected:
# `blec` swaps btleplug for `tauri-plugin-blec`, which is a Tauri mobile plugin
# and therefore ships the Kotlin driver Android needs inside the crate, where
# `tauri android init` picks it up on every regeneration. The framing and
# chunking above it are the same code as on desktop.
#
# `default-features = false` is what makes the two mutually exclusive: with the
# default `ble` feature still on, the crate refuses to build.
[target.'cfg(target_os = "android")'.dependencies]
leek-transport-ble = { path = "../transport-ble", default-features = false, features = ["blec"] }
tauri-plugin-blec = "0.12"
tokio = { version = "1", features = ["sync", "rt"] }

# The same trick again for USB. `tauri-plugin-serialplugin` is a Tauri mobile
# plugin, so the Kotlin that drives the USB Host API — enumeration, the
# per-device permission dialog, and the file descriptor the bulk transfers run
# on — ships inside the crate, and `tauri-build` wires its Gradle project in
# every time `gen/android` is regenerated. The `serialport` crate cannot do any
# of this: an unrooted Android app may not open /dev/ttyACM* at all.
#
# `default-features = false` is what makes the two backends mutually exclusive:
# with the default `serialport` feature still on, the crate refuses to build.
leek-transport-serial = { path = "../transport-serial", default-features = false, features = ["android"] }
tauri-plugin-serialplugin = "3.0.2"

# Symbols out of the shipped library.
#
# Android stores .so entries in the APK uncompressed so they can be mmap'd, so
# debug symbols are not merely large in the build tree — they are carried at
# full size in the artifact. Unstripped, this library is 220 MB and the debug
# APK is 381 MB; stripped, the same code is a fraction of that. Nothing is lost
# for a release build, which is not the artifact anyone debugs a native crash
# from; `cargo build` without --release is still unstripped and still symbolic.
[profile.release]
strip = true

# Tauri builds Android as a shared library loaded by the JVM, not an executable
# with a main(). Without this the linker produces something the APK cannot load.
[lib]
name = "leekwallet_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
