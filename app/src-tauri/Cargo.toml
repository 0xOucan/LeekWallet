[package]
name = "leekwallet-companion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "LeekWallet companion app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop speaks USB CDC; Android speaks BLE. One transport per platform, both
# behind the same protocol - see docs/PROTOCOL.md.
[target.'cfg(not(target_os = "android"))'.dependencies]
leek-transport-serial = { path = "../transport-serial" }

[target.'cfg(target_os = "android")'.dependencies]
btleplug = "0.11"
