# Scoped to the ATS mini-app, per app/packages/apps/README.md: a contract that
# serves one mini-app lives in that mini-app's contracts/ directory, so deleting
# the app takes the Solidity with it.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 10000
