# Scoped to the Aqua mini-app, per app/packages/apps/README.md: a contract that
# serves one mini-app lives in that mini-app's contracts/ directory, so deleting
# the app takes the Solidity with it.
#
# Matched to the ATS app's profile deliberately. Two apps in one repository
# compiling their Solidity under different solc versions or EVM targets is a
# difference nobody chose, and it surfaces first as a bytecode diff nobody can
# explain.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 10000

# ---------------------------------------------------------------------------
# Etherscan verification (Base mainnet, chain 8453)
#
# The key comes from the environment, never from this file: foundry.toml is
# committed and an API key in it is an API key in the git history forever.
# Foundry auto-loads `.env` from this directory, and `.env` is gitignored
# (*.env, line 7) -- so `ETHERSCAN_API_KEY=...` in that file is enough.
#
# One Etherscan v2 key covers every supported chain including Base; there is no
# separate Basescan key to obtain. `chain = 8453` is what selects the network.
# ---------------------------------------------------------------------------
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api" }
